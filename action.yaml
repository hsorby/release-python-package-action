name: 'Create release of Python package'

description: 'Create a release and upload built python package to PyPI.'

inputs:
  pypi-package-name:
    description: 'Specify the name of the python package on PyPI.org.'
    required: true
    default: 'not-a-name'
  release-heading:
    description: 'Specify the heading for the release.'
    required: false
  run-tests:
    description: 'Specify if tests should be run, unittest currently only support.'
    required: false
    default: 'off'
  tag:
    description: 'Explicitly set the tag for versioning the wheel and release title.'
    required: false

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.x
        
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel build twine
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Test
      if: inputs.run-tests == 'unittest'
      shell: bash
      run: |
        pip install -e .
        python -m unittest discover -s tests/
        
    - name: Build
      id: build
      shell: bash
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.tag }}
      run: |
        python --version
        python -m build --wheel .
        echo "dist content:"
        ls dist/
        
    - name: Publish Release
      shell: bash
      run: |
        twine upload dist/*

    - name: Resolve release heading
      id: resolve_heading
      shell: bash
      run: |
        if [ -n "${{ inputs.release-heading }}" ]; then
          HEADING="${{ inputs.release-heading }}"
        elif [ -n "${{ inputs.tag }}" ]; then
          HEADING="${{ inputs.tag }}"
        else
          HEADING="${GITHUB_REF_NAME}"
        fi

        echo "heading=$HEADING"
        echo "heading=$HEADING" >> "$GITHUB_OUTPUT"
    
    - name: Create Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ inputs.tag || github.ref_name }}" \
            --repo="$GITHUB_REPOSITORY" \
            --title="${{ steps.resolve_heading.outputs.heading }}" \
            --generate-notes
    - name: Send event
      uses: peter-evans/repository-dispatch@v4
      with:
        event-type: release-created
        client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "release_id": "${{ steps.create_release.outputs.id }}", "pypi_package_name": "${{ inputs.pypi-package-name }}"}'
